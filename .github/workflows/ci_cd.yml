name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  front-quality:
    name: Front — Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package.json

      - name: Install dependencies
        run: npm install

      - name: Lint with ESLint
        run: npm run lint

  api-quality:
    name: API — Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ruff bandit mypy

      - name: Lint (Ruff)
        run: ruff check .

      - name: Format check (Ruff)
        run: ruff format --check .

      - name: Security (Bandit)
        run: bandit -r . -x ./tests -ll -q

      - name: Type check (Mypy)
        run: mypy . --ignore-missing-imports --exclude tests

  api-test:
    name: API — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --tb=short -q

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [front-quality, api-quality, api-test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

