name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  front-quality:
    name: Front — Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package.json

      - name: Install dependencies
        run: npm install

      - name: Lint with ESLint
        run: npm run lint

  api-quality:
    name: API — Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [front-quality, api-quality]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

