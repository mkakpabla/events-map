name: CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  front-quality:
    name: Front — Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package.json

      - name: Install dependencies
        run: npm install

      - name: Lint with ESLint
        run: npm run lint

  api-quality:
    name: API — Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install ruff bandit mypy

      - name: Lint (Ruff)
        run: ruff check .

      - name: Format check (Ruff)
        run: ruff format --check .

      - name: Security (Bandit)
        run: bandit -r . -x ./tests -ll -q

      - name: Type check (Mypy)
        run: mypy . --ignore-missing-imports --exclude tests

  api-test:
    name: API — Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --tb=short -q

  docker-api:
    name: Image — API
    runs-on: ubuntu-latest
    needs: [api-quality, api-test]
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    outputs:
      built: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for API changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            changed:
              - 'api/**'

      - name: Log in to GHCR
        if: steps.filter.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.filter.outputs.changed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/event-map-api
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        if: steps.filter.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/event-map-api:latest
          cache-to: type=inline

  docker-front:
    name: Image — Front
    runs-on: ubuntu-latest
    needs: [front-quality]
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    outputs:
      built: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for Front changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            changed:
              - 'front/**'

      - name: Log in to GHCR
        if: steps.filter.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.filter.outputs.changed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/event-map-front
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        if: steps.filter.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/event-map-front:latest
          cache-to: type=inline

  deploy-api:
    name: Deploy — API
    runs-on: ubuntu-latest
    needs: [docker-api]
    if: |
      needs.docker-api.outputs.built == 'true' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        github.ref == 'refs/heads/develop'
      )
    environment:
      name: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy API
        run: echo "TODO — deploy API to ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'production' || 'staging' }}"

  deploy-front:
    name: Deploy — Front
    runs-on: ubuntu-latest
    needs: [docker-front]
    if: |
      needs.docker-front.outputs.built == 'true' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        github.ref == 'refs/heads/develop'
      )
    environment:
      name: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Front
        run: echo "TODO — deploy Front to ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'production' || 'staging' }}"

